name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages solo sirve archivos estáticos: la API de contacto
      # no entra al export (sigue corriendo en Vercel).
      - name: Quitar la API del build estático
        run: rm -rf app/api

      - name: Build estático
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_URL: https://portafolio-azure-chi-58.vercel.app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
